<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#e8ebe6" />
  
  <!-- Subtle sage texture accent -->
  <circle cx="1100" cy="100" r="300" fill="#9fe870" opacity="0.15" />
  <circle cx="100" cy="550" r="250" fill="#9fe870" opacity="0.15" />

  <!-- Logo Pill -->
  <g transform="translate(100, 100)">
    <rect width="72" height="72" rx="20" fill="#9fe870" />
    <text x="36" y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#0e0f0c" text-anchor="middle">CC</text>
    <text x="96" y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="38" fill="#0e0f0c">CodeCircle</text>
    <rect x="320" y="20" width="180" height="36" rx="18" fill="#ffffff" />
    <text x="410" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#0e0f0c" text-anchor="middle">CodeCircle.online</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="280" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="64" fill="#0e0f0c" letter-spacing="-1.5">
    A Student Tech Community
  </text>
  <text x="100" y="354" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="64" fill="#454745" letter-spacing="-1.5">
    Built for Students.
  </text>

  <!-- Subheading / description -->
  <text x="100" y="430" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="24" fill="#454745">
    Trending Tech · Internships · AI / ML · Linux · Cybersecurity · Open Source
  </text>

  <!-- Badges footer -->
  <g transform="translate(100, 490)">
    <rect width="220" height="46" rx="23" fill="#9fe870" />
    <text x="110" y="29" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#0e0f0c" text-anchor="middle">Join Code Circle</text>

    <rect x="236" y="0" width="230" height="46" rx="23" fill="#ffffff" />
    <text x="351" y="29" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#0e0f0c" text-anchor="middle">Free &amp; Open Source</text>
  </g>
</svg>
